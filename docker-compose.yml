version: '3.8'

services:
  uttam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uttam-laboratory
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=file:./dev.db
      - STATIC_DIR=/app/frontend/dist
      - JWT_SECRET=UttamLifecycleAyurvedaInventorySecretKey2024MustBeAtLeast256BitsLongForHS256
    volumes:
      - uttam_db_data:/app/backend/prisma
    restart: always

volumes:
  uttam_db_data:
